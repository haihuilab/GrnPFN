[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "grnpfn"
description = "GrnPFN: a prior-data fitted network pretrained on simulated gene-regulatory networks to predict nonadditive transcriptional responses to combined perturbations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Haihui Zhang", email = "hanfei19@gmail.com" }]
dynamic = ["version"]
keywords = [
  "single-cell",
  "perturbation",
  "genetic interaction",
  "gene-regulatory network",
  "prior-data fitted network",
  "Transformer",
  "bioinformatics",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "anndata>=0.10",
  "numpy>=1.23",
  "pandas>=1.5,<3",
  "scanpy>=1.9.6",
  "scikit-learn>=1.2",
  "scikit-misc>=0.5.2",
  "scipy>=1.11",
  "torch>=2.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/haihuilab/GrnPFN"
"Bug Tracker" = "https://github.com/haihuilab/GrnPFN/issues"

[tool.hatch.version]
path = "src/grnpfn/__about__.py"

[tool.hatch.build.targets.sdist]
include = [
  "src/grnpfn",
  "README.md",
  "LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/grnpfn"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
